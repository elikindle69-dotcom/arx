[package]
name = "arx"
version = "0.1.0"
edition = "2024"
description = "A declarative package manager for Arch Linux using JSON manifests"
authors = ["Arx Contributors"]
repository = "https://github.com/arx-dev/arx"
license = "MIT"

[dependencies]
anyhow = "1.0"
alpm = "5.0.2"
clap = { version = "4.5", features = ["derive"] }
json5 = "1.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
